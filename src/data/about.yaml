personal:
  tagline: "runner · gamer · occasional reader"
  intro:
    - "This is the part of the page where I get to drop the résumé language. I'm Dominik — I write code for a living, run competitively for fun, and spend more time thinking about both than I probably should."
    - "I grew up in Croatia and have since lived and studied in Sweden, worked in the Czech Republic, and raced across a good chunk of Europe. I like moving around, both literally and figuratively."
    - "This side of the site is where I write about things that don't fit neatly into a CV — race reports, trips, things I've been reading, things I've been thinking about."
  hobbies:
    - title: "Running"
      text: "I'm a competitive middle- and long-distance runner, member of [AK Kvarner](https://www.akkvarner.hr/). I race distances from 400m to the marathon, mostly at Croatian and European competitions."
    - title: "Cycling"
      text: "I bought my first gravel bike few months ago, and now I can't stop thinking about all the bikepacking ideas and rides I would like to do."
    - title: "Gaming"
      text: "Mostly FIFA, occasionally something else on Steam when a game catches my eye. Not such a serious gamer — just something to switch off with."
    - title: "Reading"
      text: "I read more non-fiction than fiction, mostly research articles and books, self-improvement and some classics, like Kafka and similar. Thought it would make me a better writer. The jury's still out."
    - title: "Travel"
      text: "A lot of my travel is race-motivated — showing up in a new city, running a race, exploring the surroundings."
  races:
    intro: "Some of the planned future races that I have signed up for."
    upcoming:
      - date: "2026-10-01"
        display: "2026-10-01"
        event: "B2Run"
        venue: "Zagreb - Jarun"
