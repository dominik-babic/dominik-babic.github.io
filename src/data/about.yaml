tech:
  tagline: "AI engineer · CV researcher · competitive runner"
  intro:
    - "I'm a machine learning engineer and cybersecurity enthusiast with a **Master's in Computer Science** from the University of Zagreb and KTH Royal Institute of Technology in Sweden. My work spans deep learning, computer vision and security research — built up through research collaborations, hackathons, and independent projects."
    - "Lately I've been moving into **robotics and automation**, working with ROS and ROS 2. It's a natural extension of the AI background: bridging the gap between intelligent algorithms and physical autonomous systems, especially where machine learning can improve robotic perception and decision-making in the real world."
    - "Away from the keyboard I'm a **competitive middle- and long-distance runner** — racing everything from 400m to the marathon across the European running scene."
